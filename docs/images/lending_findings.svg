<title id="chart-title">Reported approval amounts increased by 1.71% in 2025</title><desc id="chart-description">2016: $29.39 billion, 68,625 approval records; 2017: $31.51 billion, 70,152 approval records; 2018: $29.30 billion, 62,895 approval records; 2019: $27.65 billion, 56,807 approval records; 2020: $27.98 billion, 46,167 approval records; 2021: $45.22 billion, 62,155 approval records; 2022: $35.81 billion, 59,021 approval records; 2023: $33.27 billion, 64,154 approval records; 2024: $40.24 billion, 81,081 approval records; 2025: $40.93 billion, 74,098 approval records</desc></svg>