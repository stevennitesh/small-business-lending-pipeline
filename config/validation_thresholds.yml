validation_thresholds:
  sba_foia:
    required_programs:
      - 7a
      - 504

  census_bds:
    min_state_count: 51
    required_columns:
      - YEAR
      - state
      - ESTAB
      - ESTABS_ENTRY
      - ESTABS_EXIT

  bls_laus:
    required_period_pattern: "^M(0[1-9]|1[0-2])$"
    unemployment_rate_min: 0
    unemployment_rate_max: 100
