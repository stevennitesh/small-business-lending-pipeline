sba_resources:
  dataset_name: 7a_504_foia
  discovery:
    strategy: sba_open_data_metadata
    package_url: https://data.sba.gov/api/3/action/package_show?id=7-a-504-foia
    allow_dynamic_url_resolution: true
    cache_subdir: .tmp/sba_resources
  resources:
    - logical_name: sba_foia_data_dictionary
      program: all
      source_period: all
