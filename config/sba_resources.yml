      program: 7a
      source_period: fy2010_fy2019
      expected_format: csv
      required: true
      title_pattern: "FOIA - 7(a), FY2010-FY2019"
    - logical_name: sba_7a_fy2020_present
      program: 7a
      source_period: fy2020_present
      expected_format: csv
      required: true
      title_pattern: "FOIA - 7(a), FY2020-Present"
    - logical_name: sba_504_fy1991_fy2009
