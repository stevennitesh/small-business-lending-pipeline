version: 2

models:
  - name: stg_sba_7a_loans
    description: Canonical staged SBA 7(a) loan records from the latest successful FOIA snapshots.
    meta:
      grain: one row per source SBA 7(a) loan record from the latest successful snapshot
    columns:
      - name: loan_record_key
        description: Stable staged loan record key derived from source lineage and row identity.
      - name: loan_program
        description: SBA loan program identifier.
      - name: gross_approval_amount
        description: Gross SBA approval amount from the FOIA source.
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw source row.
        data_tests:
          - not_null: {}
      - name: source_resource_name
        description: SBA source resource represented by the raw row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join staged rows back to ingestion manifests.
        data_tests:
          - not_null: {}
      - name: raw_file_path
        description: Local raw file lineage when present; not used as staged row identity.
      - name: sha256_checksum
        description: SHA-256 checksum for the raw artifact represented by the staged row.


      - name: source_lender_id
        description: SBA LocationID lender identifier; not loan identity and not necessarily the named 504 third-party lender. Never deduplicate approvals by this field.
  - name: stg_sba_504_loans
    description: Canonical staged SBA 504 loan records from the latest successful FOIA snapshots.
    meta:
      grain: one row per source SBA 504 loan record from the latest successful snapshot
    columns:
      - name: loan_record_key
        description: Stable staged loan record key derived from source lineage and row identity.
      - name: loan_program
        description: SBA loan program identifier.
      - name: gross_approval_amount
        description: Gross SBA approval amount from the FOIA source.
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw source row.
        data_tests:
          - not_null: {}
      - name: source_resource_name
        description: SBA source resource represented by the raw row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join staged rows back to ingestion manifests.
        data_tests:
          - not_null: {}
      - name: raw_file_path
        description: Local raw file lineage when present; not used as staged row identity.
      - name: sha256_checksum
        description: SHA-256 checksum for the raw artifact represented by the staged row.


      - name: source_lender_id
        description: SBA LocationID lender identifier; not loan identity and not necessarily the named 504 third-party lender. Never deduplicate approvals by this field.
  - name: stg_sba_loans
    description: Combined canonical SBA loan staging model for 7(a) and 504 records.
    meta:
      grain: one row per source SBA loan record from the latest successful snapshots
    columns:
      - name: loan_record_key
        description: Stable staged loan record key derived from source lineage and row identity.
        data_tests:
          - not_null: {}
          - unique: {}
      - name: loan_program
        description: SBA loan program identifier.
        data_tests:
          - accepted_values:
              arguments:
                values: ["7a", "504"]
      - name: gross_approval_amount
        description: Gross SBA approval amount from the FOIA source.
        data_tests:
          - non_negative
      - name: borrower_state_match_status
        description: Whether borrower state abbreviation mapped to the state reference seed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["mapped", "unmapped", "missing"]
      - name: project_state_match_status
        description: Whether project state abbreviation mapped to the state reference seed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["mapped", "unmapped", "missing"]
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw source row.
        data_tests:
          - not_null: {}
      - name: source_resource_name
        description: SBA source resource represented by the raw row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join staged rows back to ingestion manifests.
        data_tests:
          - not_null: {}
      - name: raw_file_path
        description: Local raw file lineage when present; not used as staged row identity.
      - name: sha256_checksum
        description: SHA-256 checksum for the raw artifact represented by the staged row.


      - name: source_lender_id
        description: SBA LocationID lender identifier; not loan identity and not necessarily the named 504 third-party lender. Never deduplicate approvals by this field.
  - name: stg_census_bds_state_year
    description: Canonical Census BDS state-year staging model from the latest successful snapshot.
    meta:
      grain: one row per state and year from the latest successful BDS snapshot
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_fips", "year"]
    columns:
      - name: state_fips
        description: Census state FIPS code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: year
        description: BDS reference year.
      - name: state_match_status
        description: Whether the Census state value mapped to the state reference seed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["mapped", "unmapped", "missing"]
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw source row.
        data_tests:
          - not_null: {}
      - name: source_resource_name
        description: Census BDS source resource represented by the raw row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join staged rows back to ingestion manifests.
        data_tests:
          - not_null: {}
      - name: raw_file_path
        description: Local raw file lineage when present; not used as staged row identity.
      - name: sha256_checksum
        description: SHA-256 checksum for the raw artifact represented by the staged row.

  - name: stg_bls_laus_state_month
    description: Canonical BLS LAUS state-month unemployment-rate staging model from the latest successful snapshot.
    meta:
      grain: one row per state, observed month, and measure from the latest successful LAUS snapshot
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_fips", "observed_month", "measure_name"]
    columns:
      - name: state_fips
        description: BLS state FIPS code.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: unemployment_rate
        description: Monthly state unemployment rate as a decimal ratio.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: state_match_status
        description: Whether the BLS state FIPS value mapped to the state reference seed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["mapped", "unmapped", "missing"]
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw source row.
        data_tests:
          - not_null: {}
      - name: source_resource_name
        description: BLS LAUS source resource represented by the raw row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join staged rows back to ingestion manifests.
        data_tests:
          - not_null: {}
      - name: raw_file_path
        description: Local raw file lineage when present; not used as staged row identity.
      - name: sha256_checksum
        description: SHA-256 checksum for the raw artifact represented by the staged row.

  - name: stg_ingestion_manifest
    description: Staged ingestion manifests with latest-successful snapshot flag.
    meta:
      grain: one row per ingested source resource snapshot
    columns:
      - name: pipeline_run_id
        description: Pipeline run identifier.
        data_tests:
          - not_null: {}
      - name: source_system
        description: Source system that produced the raw artifact, such as sba, census, or bls.
        data_tests:
          - not_null: {}
      - name: dataset_name
        description: Source dataset represented by the manifest row.
        data_tests:
          - not_null: {}
      - name: resource_name
        description: Source resource represented by the manifest row.
        data_tests:
          - not_null: {}
      - name: storage_backend
        description: Durable raw artifact backend for the selected route, such as local or s3.
        data_tests:
          - not_null: {}
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join manifests to staged rows.
        data_tests:
          - not_null: {}
      - name: local_raw_path
        description: Local raw artifact lineage when present; not used as the cross-route identity.
      - name: s3_raw_uri
        description: S3 raw artifact lineage when present; not required for local route runs.
      - name: is_latest_successful_snapshot
        description: True when the manifest is the latest successful snapshot for its source resource.

  - name: stg_validation_result
    description: Staged raw validation results.
    meta:
      grain: one row per validation check result
    columns:
      - name: validation_check_id
        description: Stable validation check identifier.
      - name: status
        description: Validation status.

  - name: stg_pipeline_run_summary
    description: Staged pipeline-level raw loading summary.
    meta:
      grain: one row per raw warehouse load summary
    data_tests:
      - not_empty
    columns:
      - name: pipeline_run_ids
        description: Comma-separated pipeline run identifiers represented by the raw load.
      - name: loaded_at_utc
        description: UTC timestamp when raw loading completed.
      - name: raw_table_count
        description: Number of raw tables loaded into the selected warehouse route.
        data_tests:
          - non_negative
      - name: validation_status
        description: Overall validation status from the raw load summary.
