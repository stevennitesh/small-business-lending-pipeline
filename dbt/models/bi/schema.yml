version: 2

models:
  - name: bi_executive_overview
    description: Dashboard-ready executive overview by state-year.
    meta:
      grain: one row per state and year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars.
      - name: loan_count
        description: SBA approved loan count.
      - name: average_loan_size
        description: Average approved loan size.
      - name: annual_average_unemployment_rate
        description: Executive-page labor-market context field; use bi_regional_business_health for deeper context analysis.
      - name: establishment_count
        description: Executive-page business-population context field; use bi_regional_business_health for deeper context analysis.
      - name: loans_per_1000_establishments
        description: Executive-page lending intensity context field per 1,000 establishments.
      - name: approved_loan_dollars_per_establishment
        description: Executive-page approved lending dollars per establishment context field.
      - name: context_join_status
        description: Executive-page context source availability status.

  - name: bi_state_lending_trends
    description: Dashboard-ready annual state lending trends.
    meta:
      grain: one row per state and approval year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars.
      - name: loan_count
        description: SBA approved loan count.
      - name: approved_loan_amount_yoy_growth_pct
        description: Year-over-year approved dollar growth percentage.

  - name: bi_lender_concentration
    description: Dashboard-ready state-year known-lender concentration table.
    meta:
      grain: one row per state and approval year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: top_1_lender_share
        description: Top known lender share of known-lender approved dollars.
      - name: top_5_lender_share
        description: Top-five known lender share of known-lender approved dollars.
      - name: lender_count
        description: Known lender count in the state-year.

  - name: bi_industry_mix
    description: Dashboard-ready annual state industry lending mix.
    meta:
      grain: one row per state, approval year, and NAICS sector
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year", "naics_key"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: industry_approved_amount_share
        description: Industry share of approved dollars in the state-year.

  - name: bi_program_mix
    description: Dashboard-ready annual state SBA program lending mix.
    meta:
      grain: one row per state, approval year, and loan program
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year", "loan_program_key"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: program_approved_amount_share
        description: Program share of approved dollars in the state-year.

  - name: bi_regional_business_health
    description: Dashboard-ready regional business health table by state-year.
    meta:
      grain: one row per state and year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: loans_per_1000_establishments
        description: SBA loan count per 1,000 establishments.
      - name: approved_loan_dollars_per_establishment
        description: Approved SBA loan dollars per establishment.
      - name: annual_average_unemployment_rate
        description: Annual average unemployment rate as a decimal ratio.
      - name: unemployment_rate_yoy_change_pct
        description: Year-over-year annual unemployment-rate change as a decimal-point change.
      - name: establishment_count
        description: Number of establishments.
      - name: establishment_entry_rate
        description: Establishment entry rate as a decimal ratio.
      - name: establishment_exit_rate
        description: Establishment exit rate as a decimal ratio.
      - name: context_join_status
        description: Context source availability status.

  - name: bi_pipeline_health
    description: Dashboard-ready pipeline health summary.
    meta:
      grain: one row per pipeline run summary
    data_tests:
      - not_empty
    columns:
      - name: latest_run_status
        description: Overall latest run status.
      - name: validation_status
        description: Overall validation status.
      - name: freshness_status
        description: Overall source freshness status.

  - name: bi_lender_mix
    description: Dashboard-ready annual state known-lender lending mix for lender filtering and concentration detail.
    meta:
      grain: one row per state, approval year, and lender
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year", "lender_key"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: lender_key
        description: Lender dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_lender')
                field: lender_key
      - name: lender_name
        description: Lender display name.
      - name: lender_approved_amount_share
        description: Known lender share of known-lender approved dollars in the state-year.
      - name: lender_rank
        description: Known lender rank by approved dollars in the state-year.

  - name: bi_lending_performance
    description: Dashboard-ready annual state loan performance and charge-off metrics.
    meta:
      grain: one row per state and approval year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars.
      - name: loan_count
        description: SBA approved loan count.
      - name: average_loan_size
        description: Average approved loan size.
      - name: gross_chargeoff_amount
        description: Gross charge-off dollars reported by SBA.
      - name: charged_off_loan_count
        description: Count of loans whose grouped status is explicitly charged-off.
      - name: chargeoff_amount_rate
        description: Gross charge-off dollars divided by approved dollars as a decimal ratio.
      - name: charged_off_loan_count_rate
        description: Charged-off loan count divided by approved loan count as a decimal ratio.

  - name: bi_lending_status_mix
    description: Dashboard-ready annual state loan-status mix metrics.
    meta:
      grain: one row per state, approval year, and loan status group
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year", "loan_status_group"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: loan_status_group
        description: Stable status group used for loan performance KPI calculations.
      - name: loan_status_group_label
        description: Display label for the loan status group.
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars for the status group.
      - name: loan_count
        description: SBA approved loan count for the status group.
      - name: average_loan_size
        description: Average approved loan size for the status group.
      - name: gross_chargeoff_amount
        description: Gross charge-off dollars reported by SBA for the status group.
      - name: charged_off_loan_count
        description: Count of status-group loans whose grouped status is explicitly charged-off.
      - name: status_group_approved_amount_share
        description: Status-group share of approved dollars in the state-year as a decimal ratio.
      - name: status_group_loan_count_share
        description: Status-group share of approved loan count in the state-year as a decimal ratio.

  - name: bi_lending_terms_pricing
    description: Dashboard-ready annual state loan term, pricing coverage, guarantee, and 504 financing metrics.
    meta:
      grain: one row per state and approval year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars.
      - name: loan_count
        description: SBA approved loan count.
      - name: average_loan_size
        description: Average approved loan size.
      - name: term_coverage_count
        description: Number of loans with a reported term in months.
      - name: term_coverage_rate
        description: Share of loans with a reported term in months as a decimal ratio.
      - name: average_term_months
        description: Average reported loan term in months.
      - name: initial_interest_rate_coverage_count
        description: Number of loans with a reported initial interest rate.
      - name: initial_interest_rate_coverage_rate
        description: Share of loans with a reported initial interest rate as a decimal ratio.
      - name: average_initial_interest_rate
        description: Average reported initial interest rate as a decimal ratio.
      - name: interest_type_coverage_count
        description: Number of loans with a reported fixed or variable interest type.
      - name: fixed_interest_loan_count
        description: Number of loans reported with fixed interest type.
      - name: variable_interest_loan_count
        description: Number of loans reported with variable interest type.
      - name: fixed_interest_loan_share
        description: Fixed-interest share among loans with a reported interest type as a decimal ratio.
      - name: variable_interest_loan_share
        description: Variable-interest share among loans with a reported interest type as a decimal ratio.
      - name: seven_a_approved_loan_amount
        description: SBA 7(a) approved dollars.
      - name: sba_guaranteed_approval_amount
        description: SBA-guaranteed approved dollars reported for SBA 7(a) loans.
      - name: seven_a_sba_guarantee_rate
        description: SBA-guaranteed approved dollars divided by SBA 7(a) approved dollars as a decimal ratio.
      - name: third_party_dollars
        description: Third-party financing dollars reported for SBA 504 loans.
      - name: third_party_to_approved_amount_rate
        description: Third-party financing dollars divided by approved dollars as a decimal ratio.

  - name: bi_lending_jobs_impact
    description: Dashboard-ready annual state descriptive jobs-supported efficiency metrics.
    meta:
      grain: one row per state and approval year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "approval_year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: total_approved_loan_amount
        description: Approved SBA loan dollars.
      - name: loan_count
        description: SBA approved loan count.
      - name: average_loan_size
        description: Average approved loan size.
      - name: jobs_supported_coverage_count
        description: Number of loans with a reported jobs-supported value.
      - name: jobs_supported_coverage_rate
        description: Share of loans with a reported jobs-supported value as a decimal ratio.
      - name: total_jobs_supported
        description: Source-reported total jobs supported; descriptive and not causal.
      - name: jobs_supported_per_loan
        description: Source-reported jobs supported divided by loan count; descriptive, not causal.
      - name: jobs_supported_per_1m_approved
        description: Source-reported jobs supported per $1M approved; descriptive, not causal.
      - name: approved_loan_dollars_per_job_supported
        description: Approved dollars divided by source-reported jobs supported; descriptive, not causal.

  - name: bi_state_filter
    description: Dashboard-ready state and region filter helper.
    meta:
      grain: one row per state or DC
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - unique
          - not_null
      - name: state_name
        description: State display name.
      - name: census_region
        description: Census region used for Power BI regional filters.
      - name: census_division
        description: Census division used for Power BI regional filters.

  - name: bi_year_filter
    description: Dashboard-ready year filter helper built from BI table year fields.
    meta:
      grain: one row per report year
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["year"]
    columns:
      - name: year
        description: Calendar/report year used for Power BI year filters.
        data_tests:
          - unique
          - not_null
      - name: year_label
        description: Year display label.

  - name: bi_loan_program_filter
    description: Dashboard-ready SBA loan program filter helper.
    meta:
      grain: one row per SBA loan program
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["loan_program_key"]
    columns:
      - name: loan_program_key
        description: SBA loan program key.
        data_tests:
          - unique
          - not_null
      - name: loan_program_name
        description: SBA loan program display name.

  - name: bi_naics_filter
    description: Dashboard-ready NAICS sector filter helper.
    meta:
      grain: one row per NAICS sector
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["naics_key"]
    columns:
      - name: naics_key
        description: NAICS sector key.
        data_tests:
          - unique
          - not_null
      - name: naics_sector_name
        description: NAICS sector display name.
      - name: is_unknown
        description: True when the sector is the internal unknown bucket.

  - name: bi_lender_filter
    description: Dashboard-ready known-lender filter helper.
    meta:
      grain: one row per known lender
    data_tests:
      - not_empty
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["lender_key"]
    columns:
      - name: lender_key
        description: Known lender dimension key.
        data_tests:
          - unique
          - not_null
      - name: lender_name
        description: Known lender display name.
      - name: is_unknown
        description: Always false for dashboard lender filters; internal unknown lenders remain in dim_lender.
