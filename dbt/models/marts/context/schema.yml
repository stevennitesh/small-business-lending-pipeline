version: 2

models:
  - name: mart_laus_monthly_state
    description: Monthly state LAUS unemployment context mart.
    meta:
      grain: one row per state and observed month
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "observed_month"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: unemployment_rate
        description: Monthly state unemployment rate as a decimal ratio.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: unemployment_rate_yoy_change_pp
        description: Year-over-year change in monthly unemployment rate, as a decimal-point change.

  - name: mart_laus_annual_state
    description: Annual state LAUS unemployment context mart.
    meta:
      grain: one row per state and year
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: annual_average_unemployment_rate
        description: Annual average state unemployment rate as a decimal ratio.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: unemployment_rate_yoy_change_pp
        description: Year-over-year annual unemployment-rate change, as a decimal-point change.

  - name: mart_business_dynamics_annual_state
    description: Annual state Census BDS business dynamics context mart.
    meta:
      grain: one row per state and year
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: establishment_count
        description: Number of establishments.
        data_tests:
          - non_negative
      - name: establishment_entry_rate
        description: Establishment entry rate as a decimal ratio.
        data_tests:
          - non_negative
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: establishment_exit_rate
        description: Establishment exit rate as a decimal ratio.
        data_tests:
          - non_negative
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_regional_business_health_annual_state
    description: Annual state regional business-health mart combining compatible lending, LAUS, and BDS annual grains.
    meta:
      grain: one row per state and year
      powerbi_ready: true
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: ["state_key", "year"]
    columns:
      - name: state_key
        description: State dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: annual_average_unemployment_rate
        description: Annual average state unemployment rate as a decimal ratio.
      - name: unemployment_rate_yoy_change_pp
        description: Year-over-year annual unemployment-rate change, as a decimal-point change.
      - name: establishment_count
        description: Number of establishments.
        data_tests:
          - non_negative
      - name: establishment_entry_rate
        description: Establishment entry rate as a decimal ratio.
        data_tests:
          - non_negative
      - name: establishment_exit_rate
        description: Establishment exit rate as a decimal ratio.
        data_tests:
          - non_negative
      - name: loans_per_1000_establishments
        description: SBA loan count per 1,000 establishments.
        data_tests:
          - non_negative
      - name: approved_loan_dollars_per_establishment
        description: Approved SBA loan dollars per establishment.
        data_tests:
          - non_negative
      - name: has_lending_data
        description: True when lending data exists for the state-year.
      - name: has_laus_data
        description: True when LAUS unemployment data exists for the state-year.
      - name: has_business_dynamics_data
        description: True when Census BDS business dynamics data exists for the state-year.
      - name: context_join_status
        description: Flag indicating which annual context sources are present.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - complete_context
                  - missing_laus
                  - missing_business_dynamics
                  - missing_context
                  - missing_lending
