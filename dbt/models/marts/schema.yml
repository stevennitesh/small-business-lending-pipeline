version: 2

models:
  - name: dim_date
    description: Calendar date dimension covering dates present in staged source facts.
    meta:
      grain: one row per calendar date
    columns:
      - name: date_key
        description: Integer date key in YYYYMMDD format.
        data_tests:
          - not_null
          - unique

  - name: dim_state
    description: State and District of Columbia geography dimension.
    meta:
      grain: one row per state or District of Columbia FIPS code
    columns:
      - name: state_key
        description: Two-character state FIPS key.
        data_tests:
          - not_null
          - unique

  - name: dim_naics
    description: NAICS sector dimension with an explicit unknown row.
    meta:
      grain: one row per NAICS sector key
    columns:
      - name: naics_key
        description: NAICS sector key or UNKNOWN.
        data_tests:
          - not_null
          - unique

  - name: dim_lender
    description: Cleaned lender dimension with an explicit unknown row.
    meta:
      grain: one row per cleaned lender key
    columns:
      - name: lender_key
        description: Surrogate lender key or UNKNOWN.
        data_tests:
          - not_null
          - unique

  - name: dim_loan_program
    description: SBA loan program dimension.
    meta:
      grain: one row per SBA loan program
    columns:
      - name: loan_program_key
        description: SBA program key.
        data_tests:
          - not_null
          - unique

  - name: dim_source_file
    description: Source-artifact lineage dimension for raw artifacts represented in modeled facts.
    meta:
      grain: one row per canonical raw artifact URI
    columns:
      - name: source_file_key
        description: Surrogate key generated from the route-neutral raw_uri artifact identity.
        data_tests:
          - not_null
          - unique
      - name: pipeline_run_id
        description: Pipeline run identifier that loaded the raw artifact.
        data_tests:
          - not_null
      - name: source_resource_name
        description: Source resource represented by the raw artifact.
        data_tests:
          - not_null
      - name: storage_backend
        description: Local or cloud storage backend that holds the raw artifact.
        data_tests:
          - not_null
      - name: raw_uri
        description: Route-neutral raw artifact identity used to join modeled facts back to source lineage.
        data_tests:
          - not_null
          - unique
      - name: raw_file_path
        description: Optional local raw artifact lineage when present; not used as mart identity.
      - name: s3_raw_uri
        description: Optional S3 raw artifact lineage when present; not required for local route runs.

  - name: fact_sba_loans
    description: Loan-level SBA fact table for aggregation by downstream marts.
    meta:
      grain: one row per SBA loan record
      expose_to_powerbi: false
    columns:
      - name: sba_loan_fact_key
        description: Unique loan-level fact key.
        data_tests:
          - not_null
          - unique
      - name: source_file_key
        description: Source-file lineage key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source_file')
                field: source_file_key
      - name: lender_key
        description: Lender dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_lender')
                field: lender_key
      - name: naics_key
        description: NAICS sector dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_naics')
                field: naics_key
      - name: loan_program_key
        description: Loan program dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_loan_program')
                field: loan_program_key
      - name: project_state_key
        description: Project state dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: borrower_state_key
        description: Borrower state dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: approval_date_key
        description: Approval date dimension key.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: approval_year
        description: Approval calendar year when approval date is available, otherwise approval fiscal year.
      - name: loan_status
        description: Raw SBA loan status value preserved for status-mix auditability.
      - name: loan_status_key
        description: Uppercase normalized SBA loan status value used to join status grouping.
      - name: loan_status_group
        description: Stable status group used for loan performance KPI calculations.
      - name: loan_status_group_label
        description: Display label for the loan status group.
      - name: is_credit_loss_status
        description: True when the raw status explicitly represents a charged-off loan.
      - name: loan_status_sort_order
        description: Display sort order for grouped loan statuses.
      - name: paid_in_full_date
        description: Source-reported paid-in-full date when available.
      - name: chargeoff_date
        description: Source-reported charge-off date when available.
      - name: fixed_or_variable_interest_indicator
        description: Source-reported fixed or variable interest-rate indicator where available, primarily 7(a).
      - name: third_party_dollars
        description: Source-reported 504 third-party financing dollars where available.
      - name: business_type
        description: Source-reported SBA business type.
      - name: business_age
        description: Source-reported SBA business age category.
      - name: revolver_status
        description: Source-reported revolving credit status where available.
      - name: collateral_indicator
        description: Source-reported collateral indicator where available.
      - name: sold_secondary_market_indicator
        description: Source-reported secondary-market sale indicator where available.

  - name: fact_laus_state_month
    description: Monthly state LAUS unemployment-rate fact table.
    meta:
      grain: one row per state, observed month, and LAUS measure
    columns:
      - name: laus_state_month_fact_key
        description: Unique state-month-measure fact key.
        data_tests:
          - not_null
          - unique
      - name: state_key
        description: State dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: date_key
        description: Observed month date dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: source_file_key
        description: Source-file lineage key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source_file')
                field: source_file_key

  - name: fact_bds_state_year
    description: Annual state Census BDS fact table.
    meta:
      grain: one row per state and year
    columns:
      - name: bds_state_year_fact_key
        description: Unique state-year fact key.
        data_tests:
          - not_null
          - unique
      - name: state_key
        description: State dimension key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_key
      - name: date_key
        description: January 1 date dimension key for the BDS year.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: source_file_key
        description: Source-file lineage key.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_source_file')
                field: source_file_key
