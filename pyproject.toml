[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "live_api: optional tests that call live public APIs",
    "cloud: optional tests that require cloud credentials or services",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["D202", "D204", "E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/cleanup_local_data.py" = ["E402"]
"scripts/export_powerbi_tables.py" = ["E402"]
"scripts/validate_powerbi_model.py" = ["E402"]
"scripts/verify_powerbi_readiness.py" = ["E402"]
