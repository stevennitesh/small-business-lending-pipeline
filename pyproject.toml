[project]
name = "small-business-lending-pipeline"
version = "0.1.0"
description = "Analytics engineering pipeline for SBA small-business lending intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "dbt-core",
    "dbt-duckdb",
    "dbt-snowflake",
    "duckdb",
    "pandas",
    "prefect",
    "python-dotenv",
    "pyyaml",
    "requests",
    "snowflake-connector-python",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live_api: optional tests that call live public APIs",
    "cloud: optional tests that require cloud credentials or services",
]
